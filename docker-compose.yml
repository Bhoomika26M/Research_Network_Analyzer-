# Full stack: FastAPI API + PostgreSQL. No Redis (the app does not use it).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scna}
      POSTGRES_DB: ${POSTGRES_DB:-scna}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scna} -d ${POSTGRES_DB:-scna}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scna}:${POSTGRES_PASSWORD:-scna}@postgres:5432/${POSTGRES_DB:-scna}
      DEBUG: ${DEBUG:-false}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
